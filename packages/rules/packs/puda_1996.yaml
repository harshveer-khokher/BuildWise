  # --- 21. Roof-level projections (CLAUDE.md §7, clause 26) -----------------------------------
  - id: PUDA1996.roof_projection.recede
    title: Roof-level structures over 2.25 m must recede from the facade by at least their own height
    kind: roof_projection_recede
    source: {doc: puda_building_rules_1996, clause: "26", version: "1996-06-27", url: null}
    status: verified
    applies_when: {authority: GMADA, use: residential_plotted}
    height_threshold_m: 2.25
    recede_ratio: 1.0
    check: "mumty.setback_m >= mumty.height_m  (only when mumty.height_m > 2.25)"
    severity: minor
    compoundable: true
    remedies: [geometric_edit]
    enforced: true   # evaluates when BuildingModel.mumty carries height_m/setback_m; else unknown
