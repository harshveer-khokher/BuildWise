    source: {doc: chandigarh_building_rules_urban_2017, clause: "4.1", version: "2017-07-25", url: null}
    status: verified
    note: "Verified value (3). No `storeys_max` kind exists in packages/rules/engine.py yet -- BuildingModel.floors gives storey COUNT trivially, but no generic engine handler for this check kind exists today."
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    max_storeys: 3
    check: "len([f for f in floors if not f.is_stilt]) <= 3"
    severity: major
    compoundable: false
    remedies: [geometric_edit]
    enforced: false

  # --- Room minimums (CLAUDE.md §7 priority 8) -- fully enforced, no band ambiguity ------------
  - id: CHD2017.room.habitable_min_height
    title: Habitable room (and kitchen) must be at least 2.75 m high below the ceiling
    kind: room_min_height
    source: {doc: chandigarh_building_rules_urban_2017, clause: "4.1", version: "2017-07-25", url: null}
    status: verified
    note: "Room has no per-room height field; engine uses the room's Floor.height_m as proxy, same approach as puda_building_rules_1996.yaml. Habitable-room (2.75 m) and Kitchen (2.75 m) rows state the identical value, so both room_uses are checked by one rule."
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    min_m: 2.75
    room_uses: [bedroom, living, kitchen]
    check: "floor.height_m >= 2.75  (for floors containing a habitable room or kitchen)"
    severity: minor
    compoundable: true
    remedies: [geometric_edit]
    enforced: true

  - id: CHD2017.room.service_min_height
    title: Toilet / WC / bath must be at least 2.29 m high
    kind: room_min_height
    source: {doc: chandigarh_building_rules_urban_2017, clause: "4.1", version: "2017-07-25", url: null}
    status: verified
    note: >
      Room has no per-room height field; engine uses the room's Floor.height_m as proxy. Toilet,
      WC & Powder room, and Bath rows all state the identical 2.29 m value. Room.use has no
      "toilet"/"powder_room" value in the frozen schema, so both are mapped onto "wc" here (a
      disclosed simplification, not a silent one).
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    min_m: 2.29
    room_uses: [bath, wc]
    check: "floor.height_m >= 2.29  (for floors containing a bath/WC room)"
    severity: minor
    compoundable: true
    remedies: [geometric_edit]
    enforced: true

  - id: CHD2017.room.light_ventilation_ratio
    title: Window/opening area must be at least one-eighth of the habitable floor area
    kind: light_ventilation_ratio
    source: {doc: chandigarh_building_rules_urban_2017, clause: "4.1", version: "2017-07-25", url: null}
    status: verified
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    min_ratio: 0.125
    check: "room.openings_area_sqm / room_area_sqm >= 0.125"
    severity: minor
    compoundable: true
    remedies: [geometric_edit]
    enforced: true

