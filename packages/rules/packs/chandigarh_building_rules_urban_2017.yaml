    status: verified
    note: >
      Verified value (10.06 m / 33'-0", from the plinth level). Which of Phase-I/Phase-II applies
      to a given plot is an external, area-specific fact not derivable from a floor plan alone --
      an ambiguity_class: vintage-shaped question (CLAUDE.md §8), not a numeric-transcription
      problem. No `height_max` kind exists in packages/rules/engine.py yet either way.
      enforced:false pending both.
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    max_m: 10.06
    check: "height_m <= 10.06 for MARLA-category plots in Phase-I"
    severity: major
    compoundable: true
