# Chandigarh Building Rules (Urban) 2017 -- rule pack
#
# Second jurisdiction (2026-09-20). Source: corpus/raw/chandigarh_building_rules_urban_2017.pdf,
# doc_id chandigarh_building_rules_urban_2017, corpus/MANIFEST.json entry. Scope: clause 4.1
# "Residential (PLOTTED)" only -- the table a Chandigarh residential house is checked against,
# mirroring puda_building_rules_1996.yaml's own scope (Track A/B parity, not coincidence).
#
# Provenance discipline (CLAUDE.md §1 rule 6, §6.5): every rule below carries a `status` that
# came out of a real two-pass transcribe+verify run, not hand-typed belief:
#   - transcription pass -> corpus/extracted/chandigarh_building_rules_urban_2017/rule_synthesis/transcribe_pass1.json
#   - verification pass  -> corpus/extracted/chandigarh_building_rules_urban_2017/rule_synthesis/verify_pass1.json
# Both were produced by fresh Claude subagent calls per CLAUDE.md §6.4/§6.5 -- the verifier saw
# only the proposed value + raw clause text, never the transcriber's reasoning or its
# quoted-fragment justification. Verdict mapping:
#   match -> verified | mismatch -> conflict (disabled, both values kept) | not_stated -> seed_unverified
# This run produced zero `conflict` verdicts and five `not_stated` verdicts (setbacks -- no
# formula exists at all, see below; and three MARLA-band "Optional, no capacity stated" cells
# for RWH/solar-water/solar-PV/servant-quarter, which are genuinely not numeric in the clause).
#
# Two real gaps, left honest rather than guessed at:
#
# 1. SETBACKS ARE NOT A FORMULA HERE. Unlike PUDA1996 clause 17 (a fraction-of-height formula),
#    this clause's Set Backs row states only "As per Zoning/ Frame Control" -- no numeric value,
#    no formula. There is nothing for packages/rules/estimated_envelope.py's
#    _setback_formula_constants() to find in this pack (by design -- it looks for
#    kind: setback_formula rules and correctly finds none here), so the setback-estimate feature
#    is simply unavailable for Chandigarh residential-plotted cases. That is the correct,
#    honest behaviour for this jurisdiction, not a bug to fix.
#
# 2. GROUND COVERAGE / FAR / PARKING BANDS ARE VERIFIED BUT NOT ENFORCED. The clause states
#    four bands by CATEGORY LABEL (MARLA / ONE KANAL / TWO KANAL / ABOVE TWO KANAL), and the
#    two-pass pipeline verified the numeric value in each band is accurately transcribed
#    (65%/50%/45%/35% coverage; FAR 2.0/1.5/1.25/1.0; parking 1/2/3/6 ECS). What clause 4.1
#    does NOT state anywhere in its own text is the sq-metre boundary of each category --
#    marla/kanal-to-sqm conversion is a land-measurement-unit fact, not something this clause
#    states, and CLAUDE.md §1 rule 1 forbids inferring a number from outside knowledge even when
#    that number "should" be common knowledge. (This document elsewhere expresses areas in sq
#    yards for other categories, which is a further reason not to assume a generic Marla/Kanal
#    conversion applies unmodified here without checking against this specific administration's
#    own convention.) Every rule below whose applicable plot-size band can't be determined this
#    way is `enforced: false` -- the verified number stays fully citable in this pack and in
#    any report, but the engine will not apply it until the band boundary itself is verified
#    through the same discipline (a genuinely separate small task, not a numeric-value problem).
#
# Schema-gap assumptions (also in INTEGRATION.md):
#   - packages/schema/building_model.py has no field for plot use-classification, same known gap
#     as puda_building_rules_1996.yaml -- every applies_when.use below is matched as "always true"
#     by packages/rules/engine.py's `_applies()` until that field exists.
#   - Room.use has no "toilet" or "powder_room" value; this clause's "Toilet"/"WC & Powder room"
#     rows are mapped onto the schema's "wc" value (both share the verified 2.29m height), a
#     disclosed simplification, not a hidden one.
#   - No engine `kind` exists yet for a bare max-storeys check, a plinth-height check, a
#     door/window-area room-AREA check (only Floor.height_m as a room-height proxy exists via
#     `room_min_height`), or a marla/kanal-denominated plot-size band -- verified facts for all
#     of these stay in this pack as citable, `enforced: false` rows rather than being dropped,
#     exactly like puda_building_rules_1996.yaml's own courtyard.width_vs_mean_height /
#     room.open_space_min_width / staircase.riser / staircase.tread rows.
#
# `enforced: true` means packages/rules/engine.py actually evaluates this rule against a
# BuildingModel today, using the SAME generic per-`kind` handlers puda_building_rules_1996.yaml
# uses (site_coverage_slab, far_band, room_min_height, light_ventilation_ratio, floor_min_height,
# staircase_min_width, containment) -- none of that engine code is PUDA-specific; it reads every
# numeric value from the rule dict.

pack_id: chandigarh_building_rules_urban_2017
title: "Chandigarh Building Rules (Urban) 2017"
jurisdiction: CHANDIGARH
doc_id: chandigarh_building_rules_urban_2017

rules:

  # --- Zoned-area containment (flagship check, CLAUDE.md §7 priority 1) ----------------------
  # Same generic `kind: containment` as PUDA1996.containment.zoned_area -- no zoning-plan sheet
  # exists for any Chandigarh case yet, so this will correctly emit status=unknown, never a pass,
  # exactly like the Mohali cases today. Included because it costs nothing to wire and is ready
  # the moment a real zoning plan is traced for a Chandigarh plot.
  - id: CHD2017.containment.zoned_area
    title: Building footprint must sit inside the zoned area
    kind: containment
    source: {doc: chandigarh_building_rules_urban_2017, clause: "4.1", version: "2017-07-25", url: null}
    status: not_stated
    note: >
      Not a numeric transcription -- clause 4.1's own Set Backs row says only "As per Zoning/
      Frame Control", which is exactly the structural statement that a real zoning/frame-control
      plan overrides any generic setback here. No bare number exists to run through the two-pass
      verifier, so this stays "not_stated" (matching the verifier's own verdict on the Set Backs
      row) rather than "verified" by default.
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    check: "footprint.within(zoned_area)"
    severity: blocking
    compoundable: false
    remedies: [geometric_edit, zoning_revision_request]
    enforced: true

  # --- Ground coverage (verified values; band boundaries unresolved, see header) --------------
  - id: CHD2017.ground_coverage.marla
    title: Maximum ground coverage -- MARLA plots
    kind: site_coverage_slab
    source: {doc: chandigarh_building_rules_urban_2017, clause: "4.1", version: "2017-07-25", url: null}
    status: verified
    note: "Verified value (65%, plus an additional up-to-5% allowance stated in the same cell). Band boundary (which plot_area_sqm range counts as 'MARLA') is not stated in this clause -- see header. enforced:false until resolved."
    applies_when: {authority: CHANDIGARH, use: residential_plotted}
    max_pct: 65
    additional_pct_allowance: 5
    check: "ground_coverage_pct <= 65 (+5 additional allowance) for MARLA-category plots"
    severity: major
    compoundable: true
    remedies: [geometric_edit, compounding]
    enforced: false

